<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="login.metaTitle">Entrar — LALA Bridge</title>
    <meta
      data-i18n-attr="content:login.subtitle"
      name="description"
      content="Entre para continuar sua jornada de impacto"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;family=Source+Serif+4:wght@400;600&amp;display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/config.js"></script>
    <script defer src="js/i18n.js"></script>
    <script defer src="js/mock-data.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/donations.js"></script>
    <script defer src="js/offers.js"></script>
    <script defer src="js/privacy.js"></script>
    <script defer src="js/migrations.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/pages/login.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ffc200'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%231a1a1a' font-family='sans-serif' font-weight='900'>B</text></svg>"
    />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="nav.skip">Pular para o conteúdo</a>
    <nav class="nav" id="navbar">
      <div class="nav__inner">
        <a href="index.html" class="nav__logo">
          <div class="nav__logo-mark">B</div>
          LALA Bridge
        </a>
        <div class="nav__links" id="nav-menu">
          <a href="index.html" class="nav__link" data-i18n="nav.home">Início</a>
          <a href="browse.html" class="nav__link" data-i18n="nav.browse">Explorar</a>
          <a href="donate.html" class="nav__link" data-i18n="nav.donate">Doar</a>
        </div>
        <div class="nav__actions">
          <a href="register.html" class="btn btn--primary btn--sm" data-i18n="nav.getStarted"
            >Começar</a
          >
        </div>
        <button
          data-i18n-attr="aria-label:nav.menu"
          class="nav__hamburger"
          type="button"
          aria-controls="nav-menu"
          aria-expanded="false"
          aria-label="Abrir menu"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <main id="main" tabindex="-1">
      <div class="auth-page">
        <div class="auth-card">
          <div class="auth-card__header">
            <a href="index.html" class="auth-card__logo">
              <div class="nav__logo-mark" style="width: 28px; height: 28px; font-size: 0.8rem">
                B
              </div>
              LALA Bridge
            </a>
            <h1 class="auth-card__title" data-i18n="login.heading">Bem-vindo de volta</h1>
            <p class="auth-card__subtitle" data-i18n="login.subtitle">
              Entre para continuar sua jornada de impacto
            </p>
          </div>

          <form id="login-form">
            <div class="form-group">
              <label
                for="login-email"
                class="form-label form-label--required"
                data-i18n="login.email"
                >E-mail</label
              >
              <input
                data-i18n-attr="placeholder:login.emailPlaceholder"
                type="email"
                class="form-input"
                id="login-email"
                placeholder="voce@exemplo.com"
                required
                autofocus
              />
            </div>
            <div class="form-group">
              <label
                for="login-password"
                class="form-label form-label--required"
                data-i18n="login.password"
                >Senha</label
              >
              <input
                data-i18n-attr="placeholder:login.passwordPlaceholder"
                type="password"
                class="form-input"
                id="login-password"
                placeholder="Sua senha"
                required
              />
            </div>
            <div
              id="login-error"
              class="form-error"
              role="alert"
              style="margin-bottom: var(--s-5)"
            ></div>
            <button
              type="submit"
              class="btn btn--primary btn--lg btn--full"
              id="login-btn"
              data-i18n="login.submit"
            >
              Entrar
            </button>
          </form>

          <div
            id="demo-login"
            class="card card--flat"
            style="
              display: none;
              margin-top: var(--s-6);
              padding: var(--s-4);
              background: var(--cream);
            "
          >
            <p
              class="text-xs"
              style="margin-bottom: var(--s-3); color: var(--text-2)"
              data-i18n="login.demoTitle"
            >
              Modo demonstração
            </p>
            <div
              id="demo-accounts"
              style="display: flex; flex-direction: column; gap: var(--s-2)"
            ></div>
            <p class="form-hint" style="margin-top: var(--s-3)" data-i18n="login.demoHint">
              Contas fictícias guardadas só neste navegador. Nenhum dado real.
            </p>
          </div>

          <div class="auth-card__footer">
            <span data-i18n="login.noAccount">Não tem conta?</span>
            <a href="register.html" data-i18n="login.create">Crie uma</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
