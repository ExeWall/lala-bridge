<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — LALA Bridge</title>
  <meta name="description" content="Log in to your LALA Bridge account to manage donations or check your requests as a Lalíder.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌉</text></svg>">
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <!-- Navigation -->
  <nav class="navbar scrolled" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <div class="navbar__logo-icon">🌉</div>
        LALA Bridge
      </a>
      <div class="navbar__links">
        <a href="index.html" class="navbar__link">Home</a>
        <a href="browse.html" class="navbar__link">Browse</a>
        <a href="donate.html" class="navbar__link">Donate</a>
      </div>
      <div class="navbar__actions">
        <a href="register.html" class="btn btn--primary btn--sm">Get Started</a>
      </div>
      <button class="navbar__hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Login Page -->
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <a href="index.html" class="auth-card__logo">
          <div class="navbar__logo-icon" style="width: 32px; height: 32px; font-size: 1rem;">🌉</div>
          LALA Bridge
        </a>
        <h1 class="auth-card__title">Welcome Back</h1>
        <p class="auth-card__subtitle">Log in to continue your impact journey</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label form-label--required">Email</label>
          <input type="email" class="form-input" id="login-email" placeholder="you@example.com" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label form-label--required">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="Your password" required>
        </div>

        <div id="login-error" class="form-error" style="margin-bottom: var(--space-lg);"></div>

        <button type="submit" class="btn btn--primary btn--lg btn--full" id="login-btn">
          Log In
        </button>
      </form>

      <!-- Demo credentials -->
      <div class="card card--flat" style="margin-top: var(--space-xl); padding: var(--space-md);">
        <p class="text-sm" style="font-weight: 600; margin-bottom: var(--space-sm);">🧪 Demo Accounts</p>
        <div style="display: flex; flex-direction: column; gap: var(--space-sm);">
          <button class="btn btn--ghost btn--sm" onclick="fillDemo('techcorp@example.com', 'demo123')" style="justify-content: flex-start; text-align: left;">
            <span class="badge badge--donor" style="margin-right: 8px;">Donor</span>
            techcorp@example.com
          </button>
          <button class="btn btn--ghost btn--sm" onclick="fillDemo('sarah@example.com', 'demo123')" style="justify-content: flex-start; text-align: left;">
            <span class="badge badge--donor" style="margin-right: 8px;">Donor</span>
            sarah@example.com
          </button>
        </div>
        <p class="form-hint" style="margin-top: var(--space-sm);">Register as a Lalíder first to see the Lalíder dashboard.</p>
      </div>

      <div class="auth-card__footer">
        Don't have an account? <a href="register.html" style="margin-left: 4px;">Create one</a>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/donations.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        window.location.href = 'dashboard.html';
      }
    });

    function fillDemo(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
    }

    function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Logging in...';

      setTimeout(() => {
        const result = Auth.login(email, password);

        if (result.success) {
          App.showToast(result.message, 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          errorEl.textContent = '❌ ' + result.message;
          errorEl.classList.add('visible');
          btn.disabled = false;
          btn.innerHTML = 'Log In';
        }
      }, 600);
    }
  </script>
</body>
</html>
